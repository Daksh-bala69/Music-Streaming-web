<!DOCTYPE html>
<html lang="en">
	<head>
	    <meta charset="UTF-8">
	    <title>Music-Player</title>
	    <link href="css/style.css" rel="stylesheet">
	    <link  >

	    <div class="container">

		<div class="sideBar">
		    <h2 class="logo">VagiMuse</h2>	
		    
		    <nav class="menu">
			<a href="#" class="active">Home</a>
			<a href="#">Search</a>
			<a href="#">Your Library</a>
			<a href="#">Vibe Mode</a>
			<a href="#">Discover</a>
		    </nav>
		</div>

	    <!-- Player -->
		<div class="playerCard">
		    <div class="songTop">

			<div class="lyrics">
				
			</div>
		    </div>
			
		</div>
	    <!-- Queue -->	
		<div class="queue">
		    <h3>Queue</h3>

	    <!-- Bottom Player -->
		<div class="bottomPlayer">
		    Bottom Player
		</div>
	    	
	    </div>
